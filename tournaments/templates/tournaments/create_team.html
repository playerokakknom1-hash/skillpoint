{% extends 'tournaments/base.html' %}

{% block content %}
<h1 style="margin-bottom: 2rem;">🏆 Создать команду</h1>

<div class="glass-card">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Название команды</label>
            <input type="text" name="team_name" class="form-control" required placeholder="Введите название команды">
        </div>
        <button type="submit" class="btn btn-primary">Создать команду</button>
    </form>
</div>
{% endblock %}
